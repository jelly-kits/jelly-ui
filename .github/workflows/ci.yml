name: CI

# PR 与 main 都跑：PR 上拦问题，main 上保证主干始终可发布。
# 与 deploy-demo.yml 相互独立 —— 这里只校验，不发布。
#
# 纯文档改动（README / CONTRIBUTING 等）不跑：整条流水线要跑两次构建 + 三遍审计，
# 改错别字付出这个代价没必要。判定口径是「本次 push / PR 涉及的文件全部命中忽略规则」
# 才跳过 —— 只要夹带一个 .ts / .vue / .json，CI 照常跑。
# 注意：仓库若给这些 check 设了 required，跳过时它们会停在 Pending 挡住合并，
# 那种情况要改用提交信息里的 [skip ci]（同样能跳过，且是显式行为）。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

# 校验没有副作用，同一 ref 上新的推送直接取消旧的即可。
# （部署那侧刻意用 cancel-in-progress: false，两者口径不同是对的。）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与 .nvmrc 保持一致。Node 20 已于 2026-03 EOL，改用维护期 LTS 22。
          # （package.json 的 engines 仍写 >= 18 —— 那是给使用方的要求，不是 CI 的。）
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # demo/api-data.ts 是唯一的生成物提交项，所以只需比对它一个文件。
      # gen:api 幂等：组件源码没动时重跑不产生 diff。
      - name: API 表与组件源码同步
        run: |
          npm run gen:api
          if ! git diff --exit-code -- demo/api-data.ts; then
            echo "::error::demo/api-data.ts 与组件源码不同步。请在本地运行 npm run gen:api，把生成的改动一并提交。"
            exit 1
          fi

      - name: 文档站译文覆盖（页面文案）
        run: node scripts/audit-i18n.mjs

      - name: 文档站译文覆盖（API 说明）
        run: node scripts/audit-i18n.mjs --api

      - name: 减弱动效审计
        run: node scripts/audit-motion.mjs

      - name: 构建组件库
        run: npm run build

      - name: 构建文档站
        run: npm run build:demo
